name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Build the knowledge base
        run: python -m kb.importer
      - name: Export the data pack
        run: python -m kb.export --out app/public/data
      - name: Export the Simplified Chinese data pack
        run: |
          python -m kb.localize
          python -m kb.export --db data/knowledge.zh-CN.sqlite3 --out app/public/data/zh-CN

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run lint
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - run: npm run test
        working-directory: app

      - id: pages
        uses: actions/configure-pages@v6.0.0
      - run: npm run build
        working-directory: app
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
